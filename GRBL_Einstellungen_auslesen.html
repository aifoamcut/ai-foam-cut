<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>GRBL-Einstellungen auslesen (BTT SKR Pico)</title>
<style>
 :root{--bg:#f6f7f9;--fg:#1b1f24;--card:#fff;--line:#d7dbe0;--acc:#2f6feb;--ok:#127a3d;--err:#b3261e}
 @media (prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#e6e8ea;--card:#1d2125;--line:#333a41;--acc:#5b8cf5}}
 body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif}
 .wrap{max-width:900px;margin:0 auto}
 h1{font-size:20px;margin:0 0 4px}
 p.sub{margin:0 0 18px;opacity:.75;font-size:13px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
 .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
 button{font:inherit;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
 button.p{background:var(--acc);border-color:var(--acc);color:#fff}
 button:disabled{opacity:.45;cursor:default}
 label{font-size:13px;opacity:.85}
 select,input{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
 #log{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:160px;overflow:auto}
 #out{width:100%;box-sizing:border-box;min-height:300px;font:12.5px/1.45 ui-monospace,Consolas,monospace;resize:vertical}
 .st{font-size:13px}.st.ok{color:var(--ok)}.st.err{color:var(--err)}
 table{border-collapse:collapse;width:100%;font-size:13px}
 td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
 td:first-child{width:70px;font-family:ui-monospace,monospace}
 td:nth-child(2){width:110px;font-family:ui-monospace,monospace;text-align:right}
 td:nth-child(3){opacity:.75}
 .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>GRBL-Einstellungen auslesen</h1>
<p class="sub">BTT SKR Pico &middot; l&auml;uft in Chrome oder Edge (Web Serial). Board per USB anstecken, verbinden, auslesen, als TXT speichern.</p>

<div class="card">
  <div class="row">
    <button id="bConn" class="p">Verbinden</button>
    <button id="bRead" disabled>Einstellungen auslesen ($$)</button>
    <button id="bSave" disabled>Als TXT speichern</button>
    <button id="bDisc" disabled>Trennen</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label for="baud">Baudrate</label>
    <select id="baud">
      <option>115200</option><option>250000</option><option>230400</option>
      <option>57600</option><option>38400</option><option>19200</option><option>9600</option>
    </select>
    <label><input type="checkbox" id="withInfo" checked> zus&auml;tzlich $I und $# abfragen</label>
    <span id="st" class="st"></span>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <strong style="font-size:14px">Ergebnis</strong>
    <label><input type="checkbox" id="asTable"> als Tabelle mit Klartext</label>
  </div>
  <div id="tblBox" class="hide" style="margin-top:10px"><table id="tbl"></table></div>
  <textarea id="out" spellcheck="false" style="margin-top:10px" placeholder="Hier erscheinen die ausgelesenen Einstellungen..."></textarea>
</div>

<div class="card">
  <strong style="font-size:14px">Protokoll</strong>
  <div id="log" style="margin-top:8px"></div>
</div>
</div>

<script>
var DESC = {
 0:"Schrittimpuls-Laenge (us)",1:"Haltezeit Schrittmotor (ms)",2:"Schrittimpuls invertieren (Maske)",
 3:"Richtung invertieren (Maske)",4:"Enable-Signal invertieren",5:"Endschalter invertieren",
 6:"Taster-Eingang invertieren",10:"Statusbericht (Maske)",11:"Junction Deviation (mm)",
 12:"Bogentoleranz (mm)",13:"Positionsanzeige in Zoll",20:"Software-Endschalter aktiv",
 21:"Harte Endschalter aktiv",22:"Referenzfahrt aktiv",23:"Referenzfahrt-Richtung invertieren (Maske)",
 24:"Referenzfahrt langsam (mm/min)",25:"Referenzfahrt schnell (mm/min)",26:"Entprellzeit Endschalter (ms)",
 27:"Rueckzug nach Referenzfahrt (mm)",30:"Maximale Spindeldrehzahl (U/min)",31:"Minimale Spindeldrehzahl (U/min)",
 32:"Laser-Modus",100:"X Schritte/mm",101:"Y Schritte/mm",102:"Z Schritte/mm",103:"A Schritte/mm",
 110:"X Eilgang (mm/min)",111:"Y Eilgang (mm/min)",112:"Z Eilgang (mm/min)",113:"A Eilgang (mm/min)",
 120:"X Beschleunigung (mm/s2)",121:"Y Beschleunigung (mm/s2)",122:"Z Beschleunigung (mm/s2)",123:"A Beschleunigung (mm/s2)",
 130:"X Verfahrweg (mm)",131:"Y Verfahrweg (mm)",132:"Z Verfahrweg (mm)",133:"A Verfahrweg (mm)"
};

var port=null, reader=null, writer=null, keepReading=false, buf="", blocks=[], collecting=null;
function $(id){ return document.getElementById(id); }
function log(m){ var d=$('log'); d.textContent += m+"\n"; d.scrollTop=d.scrollHeight; }
function st(m,cls){ var e=$('st'); e.textContent=m; e.className='st'+(cls?' '+cls:''); }

if(!('serial' in navigator)){
  st("Web Serial nicht verfuegbar - bitte Chrome oder Edge verwenden.","err");
  $('bConn').disabled=true;
}

$('bConn').onclick = async function(){
  try{
    port = await navigator.serial.requestPort();
    await port.open({baudRate:+$('baud').value, dataBits:8, stopBits:1, parity:"none", flowControl:"none"});
    writer = port.writable.getWriter();
    keepReading = true; readLoop();
    $('bConn').disabled=true; $('bRead').disabled=false; $('bDisc').disabled=false;
    st("verbunden","ok"); log("[verbunden mit "+$('baud').value+" Baud]");
    setTimeout(function(){ send("\r\n"); }, 300);
  }catch(e){
    if(e.name!=='NotFoundError'){ st("Fehler: "+e.message,"err"); log("[Fehler] "+e.message); }
  }
};

async function readLoop(){
  while(port && port.readable && keepReading){
    reader = port.readable.getReader();
    try{
      for(;;){
        var r = await reader.read();
        if(r.done) break;
        buf += new TextDecoder().decode(r.value);
        var i;
        while((i = buf.search(/\r\n|\n|\r/)) >= 0){
          var line = buf.slice(0,i);
          buf = buf.slice(i + (buf.substr(i,2)==="\r\n" ? 2 : 1));
          handleLine(line.trim());
        }
      }
    }catch(e){ log("[Lesefehler] "+e.message); }
    finally{ try{ reader.releaseLock(); }catch(_){} }
  }
}

function handleLine(l){
  if(!l) return;
  log("< "+l);
  if(collecting){
    if(l==="ok"){ collecting.done(); }
    else if(/^error/i.test(l)){ log("[Antwort: "+l+"]"); collecting.done(); }
    else collecting.lines.push(l);
  }
}

async function send(s){ log("> "+s.trim()); await writer.write(new TextEncoder().encode(s)); }

function ask(cmd, timeout){
  timeout = timeout || 4000;
  return new Promise(async function(res){
    var c = {lines:[], done:null}, fin=false, t;
    function finish(){ if(fin) return; fin=true; collecting=null; clearTimeout(t); res(c.lines); }
    c.done = finish; collecting = c;
    t = setTimeout(function(){ log("[Zeitueberschreitung bei "+cmd+"]"); finish(); }, timeout);
    await send(cmd+"\n");
  });
}

$('bRead').onclick = async function(){
  $('bRead').disabled=true; st("lese aus...");
  var bs = [];
  var s = await ask("$$", 6000);
  bs.push({t:"GRBL-Einstellungen ($$)", l:s});
  if($('withInfo').checked){
    bs.push({t:"Build-Info ($I)", l: await ask("$I")});
    bs.push({t:"Nullpunkte ($#)", l: await ask("$#")});
  }
  blocks = bs;
  render();
  $('bRead').disabled=false; $('bSave').disabled = !s.length;
  st(s.length ? (s.length+" Zeilen gelesen") : "keine Antwort", s.length ? "ok" : "err");
};

function header(){
  var d=new Date(), p=function(n){ return String(n).padStart(2,'0'); };
  return "; GRBL-Einstellungen - BTT SKR Pico\n"
       + "; ausgelesen am "+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+"\n"
       + "; Baudrate: "+$('baud').value+"\n\n";
}

function textOut(){
  var o = header();
  for(var i=0;i<blocks.length;i++){ o += "; --- "+blocks[i].t+" ---\n"+blocks[i].l.join("\n")+"\n\n"; }
  return o;
}

function render(){
  $('out').value = textOut();
  var tb = $('tbl'); tb.innerHTML = "";
  var set = blocks[0] ? blocks[0].l : [];
  for(var i=0;i<set.length;i++){
    var m = set[i].match(/^\$(\d+)\s*=\s*(.+)$/);
    if(!m) continue;
    var tr = tb.insertRow();
    tr.insertCell().textContent = "$"+m[1];
    tr.insertCell().textContent = m[2].trim();
    tr.insertCell().textContent = DESC[+m[1]] || "";
  }
  $('tblBox').classList.toggle('hide', !$('asTable').checked || !tb.rows.length);
}
$('asTable').onchange = render;

$('bSave').onclick = async function(){
  var d=new Date(), p=function(n){ return String(n).padStart(2,'0'); };
  var name = "grbl_einstellungen_"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+".txt";
  var text = $('out').value;
  if(window.showSaveFilePicker){
    try{
      var h = await window.showSaveFilePicker({suggestedName:name, types:[{description:"Textdatei", accept:{"text/plain":[".txt"]}}]});
      var w = await h.createWritable(); await w.write(text); await w.close();
      st("gespeichert","ok"); return;
    }catch(e){ if(e.name==='AbortError') return; }
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:"text/plain;charset=utf-8"}));
  a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  st("gespeichert","ok");
};

$('bDisc').onclick = async function(){
  keepReading = false;
  try{ if(reader) await reader.cancel(); }catch(_){}
  try{ if(writer) writer.releaseLock(); }catch(_){}
  try{ if(port) await port.close(); }catch(_){}
  port=writer=reader=null;
  $('bConn').disabled=false; $('bRead').disabled=true; $('bDisc').disabled=true;
  st("getrennt"); log("[getrennt]");
};

window.addEventListener('beforeunload', function(){
  keepReading=false; try{ if(port) port.close(); }catch(_){}
});
</script>
</body>
</html>
